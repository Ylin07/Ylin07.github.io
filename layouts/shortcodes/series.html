{{ $name := .Get "name" }}
{{ $pages := (where site.RegularPages "Params.series" $name).ByWeight }}
{{ with $pages }}
<h3><a href="{{ (index . 0).Permalink }}">{{ $name }}</a></h3>
{{ end }}
{{ with .Get "desc" }}<p>{{ . }}</p>{{ end }}
<ul>
{{ range $pages }}<li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
{{ end }}</ul>
