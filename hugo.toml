baseURL = 'https://ylin07.github.io/'
title = 'Ylin'

# 站点默认语言：界面 UI 使用英文
defaultContentLanguage = 'en'
locale = 'en-us'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true

# 不使用分类/标签，关闭 taxonomy 页面生成
disableKinds = ['taxonomy', 'term']

[params]
  description = 'Shihao Wu 的个人博客：计算机系统与二进制安全的学习记录。'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4

[menu]
  [[menu.main]]
    name = 'Article'
    pageRef = '/posts'
    weight = 10
    [menu.main.params]
      zh = '文章'
  [[menu.main]]
    name = 'Series'
    pageRef = '/series'
    weight = 20
    [menu.main.params]
      zh = '系列'
  [[menu.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 30
    [menu.main.params]
      zh = '项目'
  [[menu.main]]
    name = 'Gallery'
    pageRef = '/gallery'
    weight = 40
    [menu.main.params]
      zh = '画廊'
